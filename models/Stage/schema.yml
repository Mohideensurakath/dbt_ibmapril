version: 2

models:
  - name: stg_nations
    columns:
      - name: nation_id
        tests:
          - unique
          - not_null

      - name: region_id
        description: FOREIGN KEY FOR REGIONS TABLE
        tests:
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region_id

  - name: stg_regions
    columns:
      - name: name
        description: NAME OF THE REGION
        tests:
          - accepted_values:
              arguments:
                values: ['AFRICA','AMERICA','EUROPE','MIDDLE EAST']
              


